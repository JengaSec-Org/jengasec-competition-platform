# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Dashboard → New → Blueprint → pick this repo. Render creates the web service
# from this file and prompts for every value marked sync: false.
#
# The database is Neon, not Render Postgres: Neon's free tier does not expire,
# Render's free database is deleted after 30 days. Create the Neon project
# first and paste its connection details when prompted.

services:
  - type: web
    name: jengasec
    runtime: python
    plan: free                      # starter ($7) for no spin-down + a persistent disk for uploads
    region: frankfurt               # closest to Nairobi
    branch: main
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true         # Render generates a random 64-char value
      # DJANGO_ALLOWED_HOSTS / CSRF origins: the *.onrender.com hostname is picked
      # up automatically from RENDER_EXTERNAL_HOSTNAME. Add a custom domain here
      # (comma-separated) once you have one.
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: ""

      # ── Neon ──────────────────────────────────────────────────────────────
      # ONE value: the full connection string from Neon → Connect (Pooled
      # connection ON). Looks like
      #   postgresql://neondb_owner:npg_...@ep-...-pooler.eu-central-1.aws.neon.tech/neondb?sslmode=require
      # It carries host, user, password, database and TLS in one paste, so
      # there is nothing to split up or get wrong. (The individual JENGASEC_DB_*
      # variables still work as an alternative — see config/settings.py.)
      - key: JENGASEC_DB_URL
        sync: false

      # ── First admin account (build.sh → ensure_superuser) ─────────────────
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      # ── Email (Gmail SMTP with an app password) ───────────────────────────
      # Without these the console backend is used and nothing is ever sent.
      # Queued mail is delivered right after each request commits, and the
      # queue can also be drained with `manage.py send_notification_emails`.
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: DJANGO_EMAIL_HOST_USER
        value: sucybersec@strathmore.edu
      - key: DJANGO_EMAIL_HOST_PASSWORD
        sync: false                 # the 16-character Gmail app password
      - key: DJANGO_SITE_URL
        sync: false                 # https://<your-service>.onrender.com -- links inside emails

      # ── Uploads → S3-compatible bucket (Backblaze B2) ─────────────────────
      # Render's filesystem is wiped on every deploy, so submissions live in a
      # bucket instead. Backblaze B2: 10 GB free, no card needed, S3 API.
      #   backblaze.com → sign up → Buckets → Create: `jengasec-submissions`,
      #   PRIVATE. Note the Endpoint shown on the bucket (s3.<region>.backblazeb2.com).
      #   Application Keys → Add: name `jengasec-render`, Read and Write, restricted
      #   to that bucket. keyID → S3_ACCESS_KEY_ID, applicationKey → S3_SECRET_ACCESS_KEY.
      # Any other S3-compatible store (Cloudflare R2, Supabase) works with the
      # same values — see config/settings.py.
      - key: S3_BUCKET
        value: jengasec-submissions
      - key: S3_ENDPOINT_URL
        sync: false                 # https://s3.<region>.backblazeb2.com
      - key: S3_REGION
        sync: false                 # the <region> part of the endpoint, e.g. eu-central-003
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
