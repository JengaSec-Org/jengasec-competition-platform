{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Role | JengaSec Evaluation Platform</title>
<meta name="theme-color" content="#007A3D">
<link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/variables.css' %}">
<link rel="stylesheet" href="{% static 'css/reset.css' %}">
<link rel="stylesheet" href="{% static 'css/typography.css' %}">
<link rel="stylesheet" href="{% static 'css/buttons.css' %}">
<link rel="stylesheet" href="{% static 'css/forms.css' %}">
<link rel="stylesheet" href="{% static 'css/components.css' %}">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">Jenga<em>Sec</em></div>
    <div class="auth-sub">// ONBOARDING :: SELECT ROLE</div>
    <p class="text-muted">Choose how you'll participate. Captains create and lead a team; team members request to join one.</p>

    {% if form.non_field_errors %}
      <div class="alert alert-error" role="alert">
        <span class="alert-tag">[ERR]</span>
        <span>{{ form.non_field_errors.0 }}</span>
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">
          <input type="radio" name="participant_role" value="captain" required>
          Captain — I'll create and lead a team
        </label>
      </div>
      <div class="form-group">
        <label class="form-label">
          <input type="radio" name="participant_role" value="team_member" required>
          Team Member — I'll join an existing team
        </label>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Continue</button>
    </form>
  </div>
</div>
</body>
</html>
