{% extends "accounts/auth_base.html" %}

{% block title %}Password Reset | JengaSec{% endblock %}
{% block auth_context %}RESET_COMPLETE{% endblock %}

{% block card %}
<div class="alert alert-success" role="status">
  <span class="alert-tag">[OK]</span>
  <span>Your password has been reset. You can now log in.</span>
</div>
<a href="{% url 'login' %}" class="btn btn-primary btn-block" style="margin-top:0.75rem;">Go to Login</a>
{% endblock %}
